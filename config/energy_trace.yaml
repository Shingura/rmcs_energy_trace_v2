# rmcs_energy_trace_v2 组件参数示例。
# 在 rmcs_bringup 的机器人配置中启用组件时，把下面的内容复制到对应实例名下。
#
#   rmcs_executor:
#     ros__parameters:
#       components:
#         - rmcs_energy_trace_v2::EnergyTraceComponent -> energy_trace

energy_trace:
  ros__parameters:
    mesh_path: ""
    network_path: ""
    model_dir: ""
    # 推理、配准与跟踪占用线程数，0 表示不限制
    threads: 4
